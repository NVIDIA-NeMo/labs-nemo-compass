name: Release rehearsal
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Preview release notes without creating a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: 70b75ec43d8c70219946564c75acdace748398d6
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name=v0.1.0 -f target_commitish="$RELEASE_COMMIT" \
            --jq '.name'
