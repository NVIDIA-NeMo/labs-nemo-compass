name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_SHA256: 777b4bb7ddd10bdcc8a1aa398d37d05e91e866e7586f9cff3fca2f72b8153033
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.3.3/osv-scanner_linux_amd64
        run: |
          curl --fail --location --silent --show-error "$OSV_SCANNER_URL" --output "$RUNNER_TEMP/osv-scanner"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check copyright headers
        run: uv run --locked python tools/check_copyright_headers.py

      - name: Check third-party licenses
        run: uv run --locked python tools/generate_third_party_licenses.py --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked ty check

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest

      - name: Build distribution
        run: uv build --sdist --wheel --no-sources

      - name: Check distributions
        run: uv run --locked python tools/check_distribution_licenses.py

      - name: Install application wheel in a clean environment
        run: |
          smoke_env="$(mktemp -d)"
          trap 'rm -rf "$smoke_env"' EXIT
          uv venv "$smoke_env"
          uv pip install --no-config --no-sources --python "$smoke_env/bin/python" \
            dist/insight_agent-*.whl
          cd "$smoke_env"
          "$smoke_env/bin/python" -I -c 'from insight_agent.traces import Trace; from trace_ingest import Trace as SharedTrace; assert Trace is SharedTrace'
          "$smoke_env/bin/insight-agent" --help

      - name: Validate release identity and checksum artifacts
        id: release
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python tools/check_release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Preserve validated release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist

      - name: Create draft from the validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.quality.outputs.prerelease }}
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --generate-notes --prerelease="$PRERELEASE" \
            -- *.whl *.tar.gz SHA256SUMS
